<?xml version="1.0" encoding="UTF-8"?>
<!-- Simple wireframe SVG for PokerAgent table (prototype) -->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <!-- Background -->
  <rect width="100%" height="100%" fill="#f6f7fb"/>
  <!-- Table (oval) -->
  <ellipse cx="600" cy="300" rx="520" ry="200" fill="#0b5a3a" stroke="#064a31" stroke-width="6"/>
  <ellipse cx="600" cy="300" rx="480" ry="160" fill="rgba(255,255,255,0.02)"/>
  <!-- Board area -->
  <rect x="420" y="240" width="360" height="70" rx="8" fill="#0f3d2a" stroke="#09331f" />
  <!-- Board cards placeholders -->
  <g id="board-cards" transform="translate(440,255)">
    <rect x="0" y="0" width="60" height="90" rx="6" fill="#ffffff" stroke="#ccc"/>
    <rect x="75" y="0" width="60" height="90" rx="6" fill="#ffffff" stroke="#ccc"/>
    <rect x="150" y="0" width="60" height="90" rx="6" fill="#ffffff" stroke="#ccc"/>
    <rect x="225" y="0" width="60" height="90" rx="6" fill="#ffffff" stroke="#ccc"/>
    <rect x="300" y="0" width="60" height="90" rx="6" fill="#ffffff" stroke="#ccc"/>
  </g>

  <!-- Seats (6) -->
  <!-- Top-left Seat (CPU) -->
  <g transform="translate(150,180)">
    <circle cx="0" cy="0" r="40" fill="#2b2f3a"/>
    <text x="0" y="5" font-size="12" fill="#fff" text-anchor="middle">CPU1</text>
    <rect x="-28" y="50" width="56" height="24" rx="4" fill="#fff0" stroke="#ddd" />
  </g>

  <!-- Top-right Seat (CPU) -->
  <g transform="translate(1050,180)">
    <circle cx="0" cy="0" r="40" fill="#2b2f3a"/>
    <text x="0" y="5" font-size="12" fill="#fff" text-anchor="middle">CPU2</text>
  </g>

  <!-- Right-mid Seat (CPU) -->
  <g transform="translate(1040,340)">
    <circle cx="0" cy="0" r="40" fill="#2b2f3a"/>
    <text x="0" y="5" font-size="12" fill="#fff" text-anchor="middle">CPU3</text>
  </g>

  <!-- Bottom-right Seat (CPU) -->
  <g transform="translate(800,460)">
    <circle cx="0" cy="0" r="40" fill="#2b2f3a"/>
    <text x="0" y="5" font-size="12" fill="#fff" text-anchor="middle">CPU4</text>
  </g>

  <!-- Bottom (User) -->
  <g transform="translate(600,520)">
    <rect x="-140" y="-40" width="280" height="120" rx="12" fill="#fff" stroke="#ccc"/>
    <text x="0" y="-18" font-size="14" fill="#333" text-anchor="middle">あなた（BTN）</text>
    <!-- User hole cards (face up) -->
    <g transform="translate(-80,-5)">
      <rect x="0" y="0" width="70" height="100" rx="8" fill="#fff" stroke="#999"/>
      <text x="35" y="55" font-size="22" text-anchor="middle">Ah</text>
    </g>
    <g transform="translate(-5,-5)">
      <rect x="0" y="0" width="70" height="100" rx="8" fill="#fff" stroke="#999"/>
      <text x="35" y="55" font-size="22" text-anchor="middle">Kd</text>
    </g>

    <!-- Action controls -->
    <g transform="translate(-120,60)">
      <rect x="0" y="0" width="260" height="44" rx="8" fill="#0b74ff"/>
      <text x="40" y="30" font-size="14" fill="#fff">Fold</text>
      <text x="130" y="30" font-size="14" fill="#fff">Call</text>
      <text x="220" y="30" font-size="14" fill="#fff">Raise</text>
    </g>
    <!-- Help button -->
    <g transform="translate(150,60)">
      <rect x="0" y="0" width="100" height="44" rx="8" fill="#ffb400" stroke="#b37a00"/>
      <text x="50" y="30" font-size="14" fill="#fff" text-anchor="middle">Help</text>
    </g>
  </g>

  <!-- Bottom-left Seat (CPU) -->
  <g transform="translate(400,460)">
    <circle cx="0" cy="0" r="40" fill="#2b2f3a"/>
    <text x="0" y="5" font-size="12" fill="#fff" text-anchor="middle">CPU5</text>
  </g>

  <!-- Pot display -->
  <g transform="translate(600,200)">
    <rect x="-60" y="-30" width="120" height="60" rx="8" fill="#ffd966" stroke="#b37a00"/>
    <text x="0" y="5" font-size="14" fill="#333" text-anchor="middle">Pot: 9 bb</text>
  </g>

  <!-- Top UI bar -->
  <rect x="0" y="0" width="1200" height="60" fill="#fff"/>
  <text x="24" y="36" font-size="16" fill="#333">PokerAdvisor — テキサスホールデム（プロトタイプ）</text>

  <!-- Right panel (log / help result placeholder) -->
  <rect x="920" y="60" width="260" height="660" rx="8" fill="#fff" stroke="#e6e6e6"/>
  <text x="1050" y="84" font-size="13" fill="#333" text-anchor="middle">ログ / 助言</text>
  <rect x="940" y="100" width="220" height="120" rx="6" fill="#f9f9fb" stroke="#eee"/>
  <text x="1050" y="130" font-size="12" fill="#666" text-anchor="middle">Help の結果がここに表示されます</text>

  <!-- Help modal (example overlay) -->
  <g id="help-modal" transform="translate(300,120)" opacity="0.0">
    <rect x="0" y="0" width="600" height="360" rx="10" fill="#ffffff" stroke="#d0d0d0"/>
    <text x="300" y="32" font-size="16" fill="#222" text-anchor="middle">AI 助言</text>
    <rect x="24" y="56" width="552" height="240" rx="6" fill="#f8f9fb" stroke="#eee"/>
    <text x="40" y="96" font-size="14" fill="#333">推奨: Call — bet_size: —</text>
    <text x="40" y="128" font-size="12" fill="#555">理由: ボードがブロードウェイ系であなたの AhKd は...</text>
    <g transform="translate(420,320)">
      <rect x="0" y="0" width="80" height="28" rx="6" fill="#0b74ff"/>
      <text x="40" y="19" font-size="12" fill="#fff" text-anchor="middle">Apply</text>
    </g>
    <g transform="translate(520,320)">
      <rect x="0" y="0" width="56" height="28" rx="6" fill="#e6e6e6"/>
      <text x="28" y="19" font-size="12" fill="#333" text-anchor="middle">Close</text>
    </g>
  </g>
</svg>